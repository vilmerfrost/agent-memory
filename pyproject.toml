[project]
name = "agent-memory"
version = "0.0.1"
description = "Learning loop for Vilmer's agent setup: run log, Jev-gated lessons."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk==0.7.4",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0",
    "cryptography>=43",
]

[project.scripts]
amem = "agent_memory.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
